<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шахматы: Карьера и Онлайн</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 10px;
        }
        .container { 
            text-align: center; 
            max-width: 400px; 
            width: 100%; 
            padding: 15px; 
            background: #1e293b; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
        }
        #board { 
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            width: 100%;
            aspect-ratio: 1;
            border: 3px solid #334155;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 15px; 
        }
        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            user-select: none;
        }
        .light { background: #cbd5e1; }
        .dark { background: #64748b; }
        .selected { background: #3b82f6 !important; }
        .highlight { background: #22c55e !important; }

        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }
        .btn:active { background: #2563eb; }
        .btn-secondary { background: #475569; }
        .btn-success { background: #22c55e; }
        #status { 
            font-size: 14px; 
            color: #94a3b8; 
            margin-top: 10px; 
            min-height: 20px;
            font-weight: bold;
        }
        .screen { display: none; }
        .active-screen { display: flex; flex-direction: column; gap: 10px; }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. ГЛАВНОЕ МЕНЮ -->
    <div id="screen-menu" class="screen active-screen">
        <h2 style="margin-top: 0;">♔ Шахматная Лига</h2>
        <button class="btn" onclick="startStory()">🎮 Сюжет (От Нуба до Гросса)</button>
        <button class="btn btn-secondary" onclick="startOffline()">📱 Оффлайн (Два игрока)</button>
        <button class="btn btn-success" onclick="startTeamGame()">👥 Режим 2 на 2</button>
        <button class="btn" onclick="showScreen('screen-online')" style="background: #8b5cf6;">🌐 Онлайн по коду</button>
    </div>

    <!-- 2. СЮЖЕТНЫЙ РЕЖИМ -->
    <div id="screen-story" class="screen">
        <h3 style="margin-top: 0;">📖 Сюжетная Кампания</h3>
        <button class="btn" onclick="startBotGame(1)">Уровень 1: 👶 Новичок</button>
        <button class="btn" onclick="startBotGame(2)">Уровень 2: 👦 Любитель</button>
        <button class="btn" onclick="startBotGame(3)">Уровень 3: 👨‍🎓 КМС</button>
        <button class="btn" onclick="startBotGame(4)">Уровень 4: 🏆 Мастер</button>
        <button class="btn btn-success" onclick="startBotGame(5)">Уровень 5: 👑 Гроссмейстер</button>
        <button class="btn btn-secondary" onclick="showScreen('screen-menu')" style="margin-top: 15px;">⬅️ В меню</button>
    </div>

    <!-- 3. ОНЛАЙН -->
    <div id="screen-online" class="screen">
        <h3 style="margin-top: 0;">🌐 Онлайн Комната</h3>
        <input type="text" id="room-code-input" placeholder="Введите код комнаты (например: 777)">
        <button class="btn" onclick="joinOnlineRoom()">Войти</button>
        <button class="btn btn-secondary" onclick="showScreen('screen-menu')" style="margin-top: 15px;">⬅️ В меню</button>
    </div>

    <!-- 4. ИГРОВОЙ ЭКРАН -->
    <div id="screen-game" class="screen">
        <h3
