<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шахматы</title>
    <!-- Используем надежный CDN для стилей доски -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 10px;
        }
        .container { 
            text-align: center; 
            max-width: 400px; 
            width: 100%; 
            padding: 15px; 
            background: #1e293b; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
        }
        #board { 
            width: 100%; 
            margin-bottom: 15px; 
        }
        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn:active { background: #2563eb; }
        #status { 
            font-size: 13px; 
            color: #94a3b8; 
            margin-top: 10px; 
            min-height: 20px;
        }
        .highlight { background: rgba(34, 197, 94, 0.5) !important; }
    </style>
</head>
<body>

<div class="container">
    <h3 style="margin-top: 0;">Шахматная партия</h3>
    <div id="board"></div>
    <div id="status">Партия готова. Сделайте ход.</div>
    <button class="btn" onclick="makeRandomMove()">💡 Подсказка (слуд. ход)</button>
</div>

<script>
    var board = null;
    var game = new Chess();

    function removeHighlights() {
        $('#board .square-55d63').removeClass('highlight');
    }

    // Упрощенная демонстрационная подсказка для стабильной работы на телефоне
    function makeRandomMove() {
        let possibleMoves = game.moves({ verbose: true });
        if (possibleMoves.length === 0) return;
        
        // Берем первый доступный легальный ход как подсказку
        let randomMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
        
        removeHighlights();
        $('#board .square-' + randomMove.from).addClass('highlight');
        $('#board .square-' + randomMove.to).addClass('highlight');
        $('#status').text('Подсказка: с ' + randomMove.from + ' на ' + randomMove.to);
    }

    var config = {
        position: 'start',
        draggable: true,
        // Указываем стабильный источник картинок для фигур
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
        onDrop: function(source, target) {
            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';

            removeHighlights();
            $('#status').text('Ход сделан.');
        }
    };

    $(document).ready(function() {
        board = Chessboard('board', config);
    });
</script>

</body>
</html>
