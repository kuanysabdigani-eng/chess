<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шахматы с другом</title>
    <!-- Библиотеки доски и шахматной логики -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <!-- Подключаем мини-движок Stockfish прямо в браузере -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { text-align: center; max-width: 450px; width: 100%; padding: 20px; background: #1e293b; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        #board { width: 100%; margin-bottom: 15px; }
        #secret-hint { font-size: 13px; color: #64748b; background: #0f172a; padding: 8px; border-radius: 6px; }
        /* Подсветка лучшего хода (скрытая) */
        .highlight { background: rgba(34, 197, 94, 0.4) !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Шахматный поединок</h2>
    <div id="board"></div>
    <div id="secret-hint">Нажмите клавишу <b>[ C ]</b> на клавиатуре, чтобы получить скрытую подсказку.</div>
</div>

<script>
    var board = null;
    var game = new Chess();
    var stockfish = new Worker('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js');
    var bestMove = null;

    // Слушаем движок Stockfish
    stockfish.onmessage = function(event) {
        let message = event.data;
        if (message.startsWith('bestmove')) {
            bestMove = message.split(' ')[1]; // Получаем ход в формате "e2e4"
        }
    };

    function updateStockfish() {
        stockfish.postMessage('position fen ' + game.fen());
        stockfish.postMessage('go depth 10'); // Глубина поиска для быстрого ответа
    }

    // Убираем подсветку клеток
    function removeHighlights() {
        $('#board .square-55d63').removeClass('highlight');
    }

    // Показываем подсказку тихо и незаметно (подсвечиваем клетки поля)
    function showHint() {
        if (!bestMove) return;
        removeHighlights();

        let fromSquare = bestMove.substring(0, 2);
        let toSquare = bestMove.substring(2, 4);

        // Подсвечиваем зеленым цветом откуда и куда ходить
        $('#board .square-' + fromSquare).addClass('highlight');
        $('#board .square-' + toSquare).addClass('highlight');
    }

    // Перехват нажатия клавиши "C" (скрытая активация читера)
    $(document).keydown(function(e) {
        if (e.key === 'c' || e.key === 'C' || e.key === 'с' || e.key === 'С') {
            // Имитируем случайную задержку от 1.5 до 3 секунд, чтобы выглядело натурально
            let randomDelay = Math.floor(Math.random() * 1500) + 1500;
            $('#secret-hint').text('Думаем над ходом...');
            
            setTimeout(function() {
                showHint();
                $('#secret-hint').text('Подсказка получена (нажмите C еще раз для обновления)');
            }, randomDelay);
        }
    });

    var config = {
        position: 'start',
        draggable: true,
        onDrop: function(source, target) {
            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';

            removeHighlights();
            updateStockfish(); // Обновляем позицию для движка после каждого хода
        }
    };

    board = Chessboard('board', config);
    updateStockfish();
</script>

</body>
</html>
