<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шахматы: Онлайн и Карьера</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; }
        .square { display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; user-select: none; }
        .light { background: #cbd5e1; }
        .dark { background: #64748b; }
        .chess-piece {
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 2px rgba(0,0,0,0.5);
            font-weight: bold;
        }
        .selected { background: #3b82f6 !important; }
        .highlight { background: rgba(34, 197, 94, 0.65) !important; }
        .screen { display: none; }
        .screen.active { display: block; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-3">

    <div class="w-full max-w-md bg-slate-800 p-5 rounded-xl shadow-2xl text-center">
        <!-- 1. Главное меню -->
        <div id="screen-menu" class="screen active space-y-3">
            <h2 class="text-2xl font-bold text-sky-400 mb-4">♔ Шахматный Клуб</h2>
            <button id="btn-to-online" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold p-3 rounded-lg shadow">🌐 Онлайн с другом по коду</button>
            <button id="btn-to-story" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold p-3 rounded-lg shadow">🤖 Карьера (С ботом)</button>
            <button id="btn-offline" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold p-3 rounded-lg shadow">📱 Вдвоем на одном экране</button>
        </div>

        <!-- 2. Меню онлайна -->
        <div id="screen-online-menu" class="screen space-y-3">
            <h3 class="text-xl font-bold text-sky-400 mb-2">🌐 Онлайн игра</h3>
            <button id="btn-create-room" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-3 rounded-lg shadow">➕ Создать комнату</button>
            <div class="pt-3 border-t border-slate-700">
                <input type="text" id="room-code-input" placeholder="Введите код комнаты" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-white mb-2 text-center uppercase font-mono">
                <button id="btn-join-room" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold p-3 rounded-lg shadow">🚪 Войти в комнату</button>
            </div>
            <button class="btn-back w-full bg-slate-700 hover:bg-slate-600 text-white font-bold p-3 rounded-lg mt-4">⬅️ Назад в меню</button>
        </div>

        <!-- 3. Выбор бота -->
        <div id="screen-story" class="screen space-y-2">
            <h3 class="text-xl font-bold text-sky-400 mb-2">📖 Уровень бота</h3>
            <button class="btn-bot" data-level="1" class="w-full bg-slate-700 hover:bg-slate-600 text-white p-2.5 rounded-lg font-bold w-full">👶 Новичок (Легкий)</button>
            <button class="btn-bot" data-level="2" class="w-full bg-slate-700 hover:bg-slate-600 text-white p-2.5 rounded-lg font-bold w-full">👦 Любитель (Средний)</button>
            <button class="btn-bot" data-level="3" class="w-full bg-slate-700 hover:bg-slate-600 text-white p-2.5 rounded-lg font-bold w-full">👨‍🎓 КМС (Продвинутый)</button>
            <button class="btn-bot" data-level="4" class="w-full bg-slate-700 hover:bg-slate-600 text-white p-2.5 rounded-lg font-bold w-full">🏆 Мастер (Сложный)</button>
            <button class="btn-bot" data-level="5" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white p-2.5 rounded-lg font-bold w-full">👑 Гроссмейстер (Умный)</button>
            <button class="btn-back w-full bg-slate-700 hover:bg-slate-600 text-white p-2.5 rounded-lg mt-3">⬅️ Назад в меню</button>
        </div>

        <!-- 4. Игровой экран -->
        <div id="screen-game" class="screen space-y-3">
            <div id="game-info" class="text-sm font-bold text-sky-400 bg-slate-900 p-2 rounded-lg">Игра</div>
            <div id="board" class="grid grid-cols-8 w-full aspect-square border-4 border-slate-700 rounded-lg overflow-hidden shadow-inner"></div>
            <div id="status" class="text-base font-bold text-amber-300">Ход белых</div>
            <button id="btn-undo" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold p-2.5 rounded-lg shadow">↩️ Отменить ход</button>
            <button class="btn-back w-full bg-slate-700 hover:bg-slate-600 text-white font-bold p-2.5 rounded-lg shadow">⬅️ В главное меню</button>
        </div>
    </div>

    <script>
        const piecesSymbol = {
            'r': '♖', 'n': '♘', 'b': '♗', 'q': '♕', 'k': '♔', 'p': '♙',
            'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
        };

        let boardState = [];
        let history = [];
        let turn = 'w';
        let selected = null;
        let validMoves = [];
        let gameMode = 'offline';
        let botLevel = 1;

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(screenId);
            if (target) {
                target.classList.add('active');
            }
        }

        // Привязываем кнопки через слушатели событий (надежно на 100%)
        document.getElementById('btn-to-online').addEventListener('click', () => switchScreen('screen-online-menu'));
        document.getElementById('btn-to-story').addEventListener('click', () => switchScreen('screen-story'));
        document.getElementById('btn-offline').addEventListener('click', () => {
            gameMode = 'offline';
            document.getElementById('game-info').textContent = 'Режим: Вдвоем на одном устройстве';
            document.getElementById('btn-undo').style.display = 'block';
            switchScreen('screen-game');
            resetGame();
        });
